<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>E &amp; L Wedding</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="https://elizakeale.github.io/wedding/Icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300;1,300&family=Cormorant+Upright:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      width:100%; height:100%;
      overflow:hidden;
      background:#ede0e4;
    }
    .screen {
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
    }
    .bg {
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover; object-position:center;
    }
    .card {
      position:relative; z-index:2;
      display:flex; flex-direction:column; align-items:center;
      width:clamp(200px, 22%, 329px);
    }
    .photo {
      width:100%; aspect-ratio:329/215;
      object-fit:cover; display:block;
    }
    .pw-input {
      display:block; width:100%; height:40px;
      background:#ffe993; border:none; outline:none;
      font-family:'Cormorant Upright',serif; font-weight:300;
      font-size:15px; letter-spacing:1px;
      color:#7f214d; text-align:center; text-transform:uppercase;
      padding:0 12px; -webkit-appearance:none; appearance:none;
      border-radius:0; caret-color:transparent;
    }
    .pw-input::placeholder { color:#7f214d; opacity:1; }
    .error {
      font-family:'Cormorant Infant',serif; font-style:italic;
      font-size:12px; color:#fff; text-align:center;
      margin-top:8px; min-height:18px;
      text-shadow:0 1px 3px rgba(0,0,0,0.5);
      opacity:0; transition:opacity 0.2s;
    }
    .error.show { opacity:1; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%{transform:translateX(-7px)}
      40%{transform:translateX(7px)}
      60%{transform:translateX(-5px)}
      80%{transform:translateX(5px)}
    }
    .shake { animation:shake 0.38s ease; }
    @media (max-width:600px) { .card { width:min(85vw,300px); } }
  
    .pw-cursor { position:absolute; top:50%; left:calc(50% + 74px); transform:translateY(-50%); width:1px; height:15px; background:#7f214d; pointer-events:none; animation:blink 1.1s ease-in-out infinite; }
    .pw-cursor.hidden { display:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  </style>
</head>

      <div id="wrap" class="pw-input-wrap" style="margin-top: clamp(30px, 6.3vh, 62px); position:relative; width:100%;">
        <input id="input" class="pw-input" type="password" placeholder="ENTER PASSWORD" autocomplete="off" />
        <span class="pw-cursor" id="cursor"></span>
      </div>
      <p id="error" class="error">Incorrect password — please try again.</p>
    </div>
  </div>
  <script>
    var input = document.getElementById('input');
    var error = document.getElementById('error');
    var wrap  = document.getElementById('wrap');
    setTimeout(function(){ input.focus(); }, 100);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); check(); }
    });
    input.addEventListener('input', function() {
      error.classList.remove('show');
      var cur = document.getElementById('cursor');
      if (input.value.length > 0) {
        cur.classList.add('hidden');
      } else {
        cur.classList.remove('hidden');
      }
    });
    function check() {
      if ((input.value||'').trim().toLowerCase() === 'rockpiles') {
        window.location.href = 'homepage.html';
      } else {
        error.classList.add('show');
        wrap.classList.remove('shake');
        void wrap.offsetWidth;
        wrap.classList.add('shake');
        input.value = '';
        wrap.addEventListener('animationend', function f() {
          wrap.classList.remove('shake');
          wrap.removeEventListener('animationend', f);
        });
      }
    }
  </script>
